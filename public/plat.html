<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Commandez ce plat sur AfroBite">
    <meta property="og:description" content="Ouvrez AfroBite pour voir le plat, son prix et le commander.">
    <meta property="og:image" content="/assets/logo-afrobite.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AfroBite">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="/assets/logo-afrobite.png" type="image/png">
    <title>Commander ce plat · AfroBite</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
        min-height:100vh;background:#fffaf0;color:#17130b;
        display:flex;align-items:center;justify-content:center;padding:24px;
      }
      main{
        width:100%;max-width:440px;text-align:center;background:#fff;
        border:1px solid #eadfca;border-radius:28px;padding:34px 24px;
        box-shadow:0 24px 70px rgba(68,48,11,.12);
      }
      .logo{width:132px;height:auto;margin-bottom:26px}
      .eyebrow{color:#9b7018;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
      h1{font-size:28px;line-height:1.15;font-weight:850;margin-bottom:12px}
      p{font-size:15px;color:#655b49;line-height:1.55;margin:0 auto 22px;max-width:350px}
      .dish-mark{width:64px;height:64px;border-radius:20px;background:#fff3cf;color:#b27c08;display:grid;place-items:center;margin:0 auto 20px;font-size:30px}
      .actions{display:flex;flex-direction:column;gap:12px;width:100%}
      .btn{display:block;padding:15px 20px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none;border:0;cursor:pointer}
      .btn-primary{background:#d9a311;color:#17130b;box-shadow:0 8px 25px rgba(217,163,17,.3)}
      .btn-secondary{background:#f6f1e8;color:#332b1d}
      .store-note{font-size:12px;color:#8b806d;margin-top:20px;margin-bottom:0}
    </style>
</head>
<body>
  <main>
    <img src="/assets/logo-afrobite.png" alt="AfroBite" class="logo">
    <div class="dish-mark" aria-hidden="true">🍽️</div>
    <div class="eyebrow">Lien direct restaurant</div>
    <h1>Votre plat vous attend</h1>
    <p>Ouvrez AfroBite pour découvrir ce plat, vérifier sa disponibilité et le commander.</p>
    <div class="actions">
      <a class="btn btn-primary" id="openBtn" href="#">Ouvrir dans AfroBite</a>
      <a class="btn btn-secondary" id="storeBtn" href="/">Télécharger l’application</a>
    </div>
    <p class="store-note">Si TikTok bloque l’ouverture automatique, appuyez sur « Ouvrir dans AfroBite ».</p>
  </main>
  <script>
    function getTarget() {
      var params = new URLSearchParams(window.location.search);
      var restaurantId = params.get('restaurantId');
      var dishId = params.get('dishId');
      if (!restaurantId || !dishId) {
        var parts = window.location.pathname.split('/').filter(Boolean);
        if (parts.length >= 3 && parts[0] === 'plat') {
          restaurantId = parts[1];
          dishId = parts[2];
        }
      }
      var valid = /^[a-zA-Z0-9_-]{8,100}$/;
      if (!valid.test(restaurantId || '') || !valid.test(dishId || '')) return null;
      return { restaurantId: restaurantId, dishId: dishId };
    }

    var target = getTarget();
    var ua = navigator.userAgent || '';
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var openBtn = document.getElementById('openBtn');
    var storeBtn = document.getElementById('storeBtn');

    if (target) {
      var customUrl = 'afrobite://plat/' + encodeURIComponent(target.restaurantId) + '/' + encodeURIComponent(target.dishId);
      var playUrl = 'https://play.google.com/store/apps/details?id=apps.artcom.foodtok';
      var appUrl = isAndroid
        ? 'intent://plat/' + encodeURIComponent(target.restaurantId) + '/' + encodeURIComponent(target.dishId) +
          '#Intent;scheme=afrobite;package=apps.artcom.foodtok;S.browser_fallback_url=' + encodeURIComponent(playUrl) + ';end'
        : customUrl;
      openBtn.href = appUrl;
      openBtn.addEventListener('click', function() {
        window.location.href = appUrl;
      });
    } else {
      openBtn.textContent = 'Découvrir AfroBite';
      openBtn.href = '/';
    }

    if (isAndroid) {
      storeBtn.href = 'https://play.google.com/store/apps/details?id=apps.artcom.foodtok';
      storeBtn.textContent = 'Télécharger sur Google Play';
    } else if (isIOS) {
      storeBtn.href = 'https://apps.apple.com/app/afrobite/id6740143420';
      storeBtn.textContent = 'Télécharger sur App Store';
    }
  </script>
</body>
</html>
